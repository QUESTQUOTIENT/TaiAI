name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: none of the jobs write to the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-syntax:
    name: Python syntax (compileall)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      # Byte-compile sources — catches syntax errors without installing deps.
      - run: python -m compileall -q app.py core routes src services scripts tests

  python-lint:
    name: Python lint (ruff, error subset)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      # Deliberately a narrow, high-signal subset rather than ruff's defaults:
      #   E9  syntax / IO errors
      #   F63 comparison mistakes (e.g. `is` on literals, always-true asserts)
      #   F7  syntax-adjacent statement misuse (break outside loop, ...)
      #   F82 undefined names
      # These are bugs, not style, so the job can be required without forcing a
      # repo-wide reformat. Adding it caught five live F821 NameErrors that
      # compileall cannot see because the modules import fine and only fail when
      # the offending line executes (/api/diagnostics, /api/health/deep, session
      # cleanup, cookbook log streaming).
      #
      # Ratchet: widen --select over time; do not silently relax it.
      - run: pip install ruff==0.16.0
      - run: ruff check --select E9,F63,F7,F82 app.py core routes src services scripts tests

  node-syntax:
    name: JS syntax (node --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "20"
      # Syntax-check our own JS (skip vendored libs in static/lib).
      #
      # This previously globbed only `static/app.js static/js/**/*.js`, which
      # silently skipped the other three top-level scripts — including
      # static/sw.js, the service worker registered by index.html and
      # coding.html. It had an unbalanced arrow-function body and could not
      # parse, so PWA offline caching was dead and CI could not see it.
      # Enumerate every non-vendored .js instead of hand-listing paths.
      - name: node --check
        run: |
          find static -name '*.js' -not -path 'static/lib/*' -print0 \
            | xargs -0 -n1 -P4 node --check

  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    # P1-23: previously `continue-on-error: true` because of known flakes. The
    # documented roadmap target is to make this required once green — until
    # then, individual test files can be marked xfail/skip without failing
    # the whole job, but a NEW failure surfaces the same PR.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Detect whether this PR only touches documentation files.
      # If so, skip the expensive pytest run while still reporting a passing check.
      - name: Check for docs-only changes
        id: docs-check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi
          # List all changed files; if every file matches docs/markdown patterns, skip pytest.
          changed=$(git diff --name-only "$BASE" "$HEAD" 2>/dev/null || git diff --name-only HEAD~1 HEAD)
          non_docs=$(echo "$changed" | grep -Ev '^(docs/|.*\.md$|\.github/[^/]+\.md$)' || true)
          if [ -z "$non_docs" ]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "Docs-only change detected — skipping pytest."
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: steps.docs-check.outputs.docs_only != 'true'
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.docs-check.outputs.docs_only != 'true'
      - run: mkdir -p data  # sqlite DB lives at ./data/app.db
        if: steps.docs-check.outputs.docs_only != 'true'
      - run: python -m pytest -q
        if: steps.docs-check.outputs.docs_only != 'true'

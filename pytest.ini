# P2-40: pytest defaults — discover tests under tests/, treat warnings as
# errors so deprecation warnings surface in CI, and keep asyncio mode
# strict so every async test is explicitly marked.
[pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
markers =
    area_security: Security regression suite
    area_cli: CLI script tests
    area_db: Database / SQL tests
    area_api: API integration tests
    area_core: Core module tests (diagnostics, agent_profiles, research_presets, etc)
    area_a11y: Accessibility / theme tests
    sub_owner_scope: Owner-scoping security tests
    sub_xss: XSS regression tests
    sub_ssrf: SSRF regression tests
    sub_path_traversal: Path traversal tests
    sub_integrity: Backup integrity / hashing tests
    sub_slim: Slim Agent Mode tests
    slow: Tests that take >1s; skip in fast feedback loops
    area_uncategorized: Tests not yet classified into the taxonomy
asyncio_mode = strict
filterwarnings =
    error
    ignore::DeprecationWarning:websockets.*
    ignore::DeprecationWarning:uvloop.*
    ignore::sqlalchemy.exc.MovedIn20Warning
    ignore::sqlalchemy.exc.SAWarning
    ignore::DeprecationWarning:chromadb.*
    ignore::DeprecationWarning:posthog.*
    ignore::pytest.PytestUnknownMarkWarning
